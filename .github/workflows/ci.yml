name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run by hand from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm i18n:check
      # The app must build with an empty environment (docs/ARCHITECTURE.md §6).
      # next/font downloads Roboto from Google at build time; a failed download is retried once.
      - run: pnpm build || (sleep 10 && pnpm build)
      - run: pnpm exec playwright install --with-deps chromium
      # Builds again with the e2e flags (phase 2 + dev surfaces).
      - run: pnpm e2e
        env:
          FEATURE_FLAGS: phase2
          ENABLE_DEV_SURFACES: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Local Supabase: migrations apply, the policies hold (pgTAP), the functions lint clean.
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Database, Auth and Storage are enough: the migrations need the auth and storage schemas.
      - run: pnpm exec supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor,postgrest
      - run: pnpm exec supabase db reset
      - run: pnpm exec supabase test db
      - run: pnpm exec supabase db lint --fail-on error
