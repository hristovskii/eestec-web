pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: '*.{ts,tsx,js,mjs,json,css,md,yml,yaml}'
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    - name: eslint
      glob: '*.{ts,tsx,js,mjs}'
      run: pnpm eslint --fix {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: unit
      run: pnpm test
