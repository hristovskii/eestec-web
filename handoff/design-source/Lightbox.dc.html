<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gallery lightbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="font-family: Roboto, 'Helvetica Neue', Arial, sans-serif; color: #ffffff">

<sc-if value="{{isDesktop}}" hint-placeholder-val="{{ true }}">
<div role="dialog" aria-modal="true" aria-label="Photo gallery: {{title}}" style="position: relative; width: 1440px; height: 900px; background: #141414; display: flex; flex-direction: column; box-sizing: border-box">
  <div style="height: 72px; padding: 0 24px 0 32px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 16px; font-weight: 700">{{title}}</span>
      <span style="font-size: 14px; font-weight: 500; color: #c7c7c7">Photo {{index}} of {{count}}</span>
    </div>
    <button type="button" aria-label="Close gallery" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.12); color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
  </div>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 32px; padding: 0 32px">
    <button type="button" aria-label="Previous photo" style="width: 56px; height: 56px; flex-shrink: 0; border: 0; border-radius: 50%; background: #ffffff; color: #1a1a1a; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 14px; align-items: center">
      <div style="width: 1040px; height: 585px; border-radius: 8px; background: repeating-linear-gradient(135deg, #2a2a2a 0 14px, #252525 14px 28px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #9a9a9a">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
        <span style="font-size: 14px">Full-size photo</span>
      </div>
      <figcaption style="font-size: 15px; font-weight: 500; color: #e6e6e6">{{caption}}</figcaption>
    </figure>
    <button type="button" aria-label="Next photo" style="width: 56px; height: 56px; flex-shrink: 0; border: 0; border-radius: 50%; background: #ffffff; color: #1a1a1a; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
  </div>
  <div style="height: 120px; display: flex; align-items: center; justify-content: center; gap: 10px">
    <sc-for list="{{thumbs}}" as="t" hint-placeholder-count="9">
      <button type="button" aria-label="Photo {{t.n}}" aria-current="{{t.current}}" style="width: 96px; height: 64px; padding: 0; border: 0; border-radius: 6px; background: repeating-linear-gradient(135deg, #3a3a3a 0 8px, #333333 8px 16px); opacity: {{t.opacity}}; box-shadow: {{t.ring}}; cursor: pointer"></button>
    </sc-for>
  </div>
</div>
</sc-if>

<sc-if value="{{isMobile}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-modal="true" aria-label="Photo gallery: {{title}}" style="position: relative; width: 390px; height: 844px; background: #000000; display: flex; flex-direction: column; box-sizing: border-box">
  <div style="height: 64px; padding: 0 8px 0 16px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 15px; font-weight: 500">{{index}} / {{count}}</span>
    <button type="button" aria-label="Close gallery" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px">
    <div style="width: 390px; aspect-ratio: 4 / 3; background: repeating-linear-gradient(135deg, #2a2a2a 0 14px, #252525 14px 28px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #9a9a9a">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
      <span style="font-size: 14px">Full-size photo</span>
    </div>
    <p style="margin: 0; padding: 0 16px; font-size: 15px; font-weight: 500; line-height: 1.45; color: #e6e6e6">{{caption}}</p>
    <span style="align-self: center; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #c7c7c7"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6M9 6l6 6-6 6" transform="translate(-3 0)"></path></svg>Swipe to browse</span>
  </div>
  <div style="display: flex; gap: 6px; overflow-x: auto; padding: 16px 16px 28px">
    <sc-for list="{{thumbs}}" as="t" hint-placeholder-count="9">
      <button type="button" aria-label="Photo {{t.n}}" aria-current="{{t.current}}" style="flex: 0 0 56px; height: 56px; padding: 0; border: 0; border-radius: 6px; background: repeating-linear-gradient(135deg, #3a3a3a 0 8px, #333333 8px 16px); opacity: {{t.opacity}}; box-shadow: {{t.ring}}"></button>
    </sc-for>
  </div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["desktop","mobile"],"default":"desktop"},"title":{"editor":"text","default":"Power Up — Renewable Grids"},"caption":{"editor":"text","default":"Team presentations on the last day · Photo: Ana Trajkovska"},"index":{"editor":"number","default":5},"count":{"editor":"number","default":24},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const device = this.props.device ?? 'desktop';
    const thumbs = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => ({
      n,
      current: n === 5 ? 'true' : 'false',
      opacity: n === 5 ? 1 : 0.55,
      ring: n === 5 ? '0 0 0 2px #141414, 0 0 0 4px #e52a30' : 'none'
    }));
    return {
      title: this.props.title ?? 'Power Up — Renewable Grids', caption: this.props.caption ?? 'Team presentations on the last day · Photo: Ana Trajkovska', index: this.props.index ?? 5, count: this.props.count ?? 24, isDesktop: device === 'desktop', isMobile: device === 'mobile', thumbs };
  }
}
</script>
</body>
</html>
