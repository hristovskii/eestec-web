<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apply box</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<section aria-label="Application" style="width: 100%; padding: 24px; border: 1px solid #e3e3e3; border-radius: 16px; background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 18px; font-family: Roboto, 'Helvetica Neue', Arial, sans-serif; color: #1a1a1a; box-sizing: border-box">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <span style="font-size: 18px; font-weight: 700">Application</span>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; background: {{badgeBg}}; color: {{badgeFg}}; border: {{badgeBorder}}; font-size: 14px; font-weight: 500; white-space: nowrap; box-sizing: border-box">{{badgeLabel}}</span>
  </div>

  <sc-if value="{{hasCountdown}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 14px; font-weight: 500; color: {{labelColor}}">{{cdLabel}}</span>
      <div role="timer" aria-label="{{cdAria}}" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{cd}}" as="c" hint-placeholder-count="4">
          <div style="padding: 10px 0 8px; border-radius: 10px; background: {{c.bg}}; display: flex; flex-direction: column; align-items: center">
            <span style="font-size: 28px; font-weight: 700; line-height: 1.1; color: {{c.fg}}">{{c.v}}</span>
            <span style="font-size: 14px; font-weight: 500; color: {{c.ufg}}">{{c.u}}</span>
          </div>
        </sc-for>
      </div>
      <span style="font-size: 14px; color: #6b6b6b">{{deadlineText}}</span>
    </div>
  </sc-if>

  <sc-if value="{{hasMessage}}" hint-placeholder-val="{{ false }}">
    <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #1a1a1a">{{message}}</p>
  </sc-if>

  <sc-if value="{{isFull}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 500">Places taken</span><span style="font-weight: 700">20 / 20</span></div>
      <div role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="20" aria-label="Places taken" style="height: 8px; border-radius: 999px; background: #ececec; overflow: hidden"><span style="display: block; width: 100%; height: 100%; background: #e52a30"></span></div>
      <span style="font-size: 14px; color: #6b6b6b">7 people on the waitlist</span>
    </div>
  </sc-if>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-if value="{{btnPrimary}}" hint-placeholder-val="{{ true }}">
      <a href="{{btnHref}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 8px; background: #e52a30; color: #ffffff; font-size: 17px; font-weight: 500; text-decoration: none">{{btnLabel}}</a>
    </sc-if>
    <sc-if value="{{btnSecondary}}" hint-placeholder-val="{{ false }}">
      <a href="{{btnHref}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 8px; border: 2px solid #e52a30; background: #ffffff; color: #e52a30; font-size: 17px; font-weight: 500; text-decoration: none; box-sizing: border-box">{{btnLabel}}</a>
    </sc-if>
    <sc-if value="{{btnDisabled}}" hint-placeholder-val="{{ false }}">
      <button type="button" disabled style="height: 52px; border: 0; border-radius: 8px; background: #e6e6e6; color: #6b6b6b; font-family: inherit; font-size: 17px; font-weight: 500; cursor: not-allowed">{{btnLabel}}</button>
    </sc-if>
    <div style="position: relative">
      <button type="button" aria-haspopup="menu" aria-expanded="{{calExpanded}}" style="width: 100%; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid #c7c7c7; border-radius: 8px; background: #ffffff; color: #1a1a1a; font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e52a30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"></path></svg>Add to calendar
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <sc-if value="{{calOpen}}" hint-placeholder-val="{{ false }}">
        <div role="menu" style="margin-top: 6px; border: 1px solid #e3e3e3; border-radius: 10px; background: #ffffff; box-shadow: 0 8px 24px rgba(0,0,0,0.12); padding: 6px; display: flex; flex-direction: column">
          <a role="menuitem" href="#" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 6px; background: #f5f5f5; color: #1a1a1a; font-size: 15px; font-weight: 500; text-decoration: none">Google Calendar</a>
          <a role="menuitem" href="#" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 6px; color: #1a1a1a; font-size: 15px; text-decoration: none">Apple Calendar (.ics)</a>
          <a role="menuitem" href="#" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 6px; color: #1a1a1a; font-size: 15px; text-decoration: none">Outlook (.ics)</a>
        </div>
      </sc-if>
    </div>
  </div>

  <sc-if value="{{hasFootnote}}" hint-placeholder-val="{{ true }}">
    <span style="font-size: 14px; line-height: 1.5; color: #6b6b6b">{{footnote}}</span>
  </sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"status":{"editor":"enum","options":["open","closing","soon","closed","full","external"],"default":"open"},"calendarOpen":{"editor":"boolean","default":false},"$preview":{"width":380,"height":383}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.status ?? 'open';
    const cdOf = (d, h, m, sec) => [{ v: d, u: 'days' }, { v: h, u: 'hours' }, { v: m, u: 'min' }, { v: sec, u: 'sec' }];
    const S = {
      open: { badge: ['Applications open', '#e52a30', '#ffffff', '0'], cd: cdOf('13', '05', '42', '08'), cdLabel: 'Applications close in', deadline: 'Deadline: Sun 18 Oct 2026, 23:59', btn: ['primary', 'Apply now', '#apply'], foot: '24 places · Results by 25 Oct' },
      closing: { badge: ['Closing soon', '#e52a30', '#ffffff', '0'], cd: cdOf('02', '05', '42', '08'), cdLabel: 'Last chance! Applications close in', urgent: true, deadline: 'Deadline: Tue 6 Oct 2026, 23:59', btn: ['primary', 'Apply now', '#apply'], foot: '30 places · Free for FEEIT students' },
      soon: { badge: ['Opening soon', '#ffffff', '#1a1a1a', '1.5px solid #1a1a1a'], cd: cdOf('10', '17', '42', '08'), cdLabel: 'Applications open in', neutral: true, deadline: 'Opens: Thu 15 Oct 2026, 12:00', btn: ['disabled', 'Opens 15 Oct'], foot: 'Follow @eestec_skopje on Instagram for the announcement.' },
      closed: { badge: ['Applications closed', '#f5f5f5', '#6b6b6b', '0'], msg: 'Applications closed on 1 Oct 2026. Selected participants will get an e-mail by 8 Oct.', btn: ['disabled', 'Applications closed'], foot: 'Missed it? See the other upcoming events.' },
      full: { badge: ['Full', '#1a1a1a', '#ffffff', '0'], full: true, msg: 'All places are taken. Join the waitlist and we will e-mail you if a place opens up.', btn: ['secondary', 'Join the waitlist', '#apply'], foot: 'Waitlist closes when the event starts.' },
      external: { badge: ['Applications open', '#e52a30', '#ffffff', '0'], cd: cdOf('18', '05', '42', '08'), cdLabel: 'Applications on eestec.net close in', deadline: 'Deadline: Fri 23 Oct 2026, 23:59 (CET)', msg: 'Organized by LC Kraków. Applications are handled on eestec.net with your EESTEC account.', btn: ['primary', 'Apply on eestec.net ↗', 'https://eestec.net'], foot: 'LC Skopje members: ask the board for a motivation letter review.' }
    };
    const c = S[s] || S.open;
    const cd = (c.cd || []).map((x) => Object.assign({}, x, {
      bg: c.urgent ? '#e52a30' : '#f5f5f5',
      fg: c.urgent ? '#ffffff' : (c.neutral ? '#1a1a1a' : '#e52a30'),
      ufg: c.urgent ? '#ffffff' : '#6b6b6b'
    }));
    return {
      badgeLabel: c.badge[0], badgeBg: c.badge[1], badgeFg: c.badge[2], badgeBorder: c.badge[3],
      hasCountdown: cd.length > 0,
      cd,
      cdLabel: c.cdLabel || '',
      cdAria: c.cdLabel ? c.cdLabel + ' ' + cd.map((x) => x.v + ' ' + x.u).join(', ') : '',
      labelColor: c.urgent ? '#b81f24' : '#1a1a1a',
      boxBg: c.urgent ? '#e52a30' : '#f5f5f5',
      numFg: c.urgent ? '#ffffff' : (c.neutral ? '#1a1a1a' : '#e52a30'),
      unitFg: c.urgent ? '#ffffff' : '#6b6b6b',
      deadlineText: c.deadline || '',
      hasMessage: !!c.msg,
      message: c.msg || '',
      isFull: !!c.full,
      btnPrimary: c.btn[0] === 'primary',
      btnSecondary: c.btn[0] === 'secondary',
      btnDisabled: c.btn[0] === 'disabled',
      btnLabel: c.btn[1],
      btnHref: c.btn[2] || '#',
      calOpen: !!this.props.calendarOpen,
      calExpanded: this.props.calendarOpen ? 'true' : 'false',
      hasFootnote: !!c.foot,
      footnote: c.foot || ''
    };
  }
}
</script>
</body>
</html>
