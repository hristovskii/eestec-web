<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in / Register — EESTEC LC Skopje</title>
<script src="./support.js"></script>
<link rel="icon" href="/_blob/8858145c0d6ab17bd53787fe90c4332b">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#f5f5f5;font-family:Roboto,Arial,sans-serif}</style>
</helmet>
<div style="width: 100%">
<sc-if value="{{isDesktop}}" hint-placeholder-val="{{ true }}">
  <div style="width: 100%; background: #f5f5f5">
    <dc-import name="Header" variant="desktop" active="" auth="guest" hint-size="100%,72px"></dc-import>
    <main style="padding: 64px 24px 96px; display: flex; justify-content: center">
      <div style="width: 100%; max-width: {{maxW}}"><dc-import name="AuthForm" state="{{state}}" hint-size="100%,640px"></dc-import></div>
    </main>
    <dc-import name="Footer" variant="desktop" hint-size="100%,444px"></dc-import>
  </div>
</sc-if>
<sc-if value="{{isMobile}}" hint-placeholder-val="{{ false }}">
  <div style="width: 390px; background: #f5f5f5">
    <dc-import name="Header" variant="mobile" active="" auth="guest" hint-size="390px,64px"></dc-import>
    <main style="padding: 20px 16px 40px"><div style="width: 100%"><dc-import name="AuthForm" state="{{state}}" device="mobile" hint-size="358px,640px"></dc-import></div></main>
    <dc-import name="Footer" variant="mobile" hint-size="390px,860px"></dc-import>
  </div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["login","login-error","login-pending","forgot","sent","reset","register","register-errors","check-email","pending","expired"],"default":"login"},"device":{"editor":"enum","options":["desktop","mobile"],"default":"desktop"},"$preview":{"width":1440,"height":1159}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state ?? 'login';
    const device = this.props.device ?? 'desktop';
    return { state: st, isDesktop: device === 'desktop', isMobile: device === 'mobile', maxW: st.indexOf('register') === 0 ? '760px' : '480px' };
  }
}
</script>
</body>
</html>
