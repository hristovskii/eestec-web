<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Admin sections" style="width: {{w}}; min-height: {{minH}}; display: flex; flex-direction: column; gap: 4px; padding: {{pad}}; box-sizing: border-box; font-family: Roboto, 'Helvetica Neue', Arial, sans-serif; color: #1a1a1a; background: #ffffff">
  <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 {{logoPad}}; margin-bottom: 8px; border-bottom: 1px solid #ececec">
    <sc-if value="{{wide}}" hint-placeholder-val="{{ true }}">
      <img src="/_blob/50a34c7b9e3bee5c6211c37ed7b78ae3" alt="EESTEC LC Skopje" style="height: 34px; width: auto">
      <span style="height: 22px; padding: 0 8px; border-radius: 6px; background: #f5f5f5; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #6b6b6b; display: inline-flex; align-items: center">ADMIN</span>
    </sc-if>
    <sc-if value="{{rail}}" hint-placeholder-val="{{ false }}">
      <img src="/_blob/8858145c0d6ab17bd53787fe90c4332b" alt="EESTEC LC Skopje admin" style="width: 36px; height: 36px; border-radius: 8px">
    </sc-if>
  </div>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
    <div style="display: flex; flex-direction: column; gap: 2px; padding-top: {{g.gap}}">
      <sc-if value="{{g.showLabel}}" hint-placeholder-val="{{ true }}">
        <span style="padding: 6px 12px 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8a8a8a">{{g.label}}</span>
      </sc-if>
      <sc-for list="{{g.items}}" as="i" hint-placeholder-count="4">
        <a href="{{i.href}}" aria-current="{{i.current}}" title="{{i.t}}" style="position: relative; display: flex; align-items: center; justify-content: {{i.justify}}; gap: 10px; height: 38px; padding: 0 {{i.padX}}; border-radius: 8px; background: {{i.bg}}; color: {{i.fg}}; font-size: 14px; font-weight: {{i.weight}}; text-decoration: none; white-space: nowrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{i.ic}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="{{i.icon}}"></path></svg>
          <sc-if value="{{i.showText}}" hint-placeholder-val="{{ true }}"><span style="flex: 1">{{i.t}}</span></sc-if>
          <sc-if value="{{i.hasCount}}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; height: 20px; padding: 0 7px; border-radius: 999px; background: #e52a30; color: #ffffff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{i.count}}</span></sc-if>
          <sc-if value="{{i.hasDot}}" hint-placeholder-val="{{ false }}"><span aria-label="{{i.count}} waiting" style="position: absolute; top: 6px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #e52a30; box-shadow: 0 0 0 2px #ffffff"></span></sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>
  <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid #ececec; display: flex; flex-direction: column; gap: 2px">
    <a href="/" title="View site" style="display: flex; align-items: center; justify-content: {{footJustify}}; gap: 10px; height: 38px; padding: 0 {{footPad}}; border-radius: 8px; color: #6b6b6b; font-size: 14px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"></path></svg><sc-if value="{{wide}}" hint-placeholder-val="{{ true }}"><span>View site</span></sc-if></a>
    <button type="button" aria-label="{{collapseLabel}}" title="{{collapseLabel}}" style="display: flex; align-items: center; justify-content: {{footJustify}}; gap: 10px; height: 38px; padding: 0 {{footPad}}; border: 0; border-radius: 8px; background: transparent; color: #6b6b6b; font-family: inherit; font-size: 14px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{collapseIcon}}"></path></svg><sc-if value="{{wide}}" hint-placeholder-val="{{ true }}"><span>Collapse menu</span></sc-if></button>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"Dashboard"},"rail":{"editor":"boolean","default":false},"$preview":{"width":248,"height":984}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Dashboard';
    const rail = !!this.props.rail;
    const I = {
      dash: 'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z',
      approve: 'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11',
      inbox: 'M22 12h-6l-2 3h-4l-2-3H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z',
      home: 'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10',
      map: 'M1 6v16l7-4 8 4 7-4V2l-7 4-8-4zM8 2v16M16 6v16',
      cal: 'M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM16 2v4M8 2v4M3 10h18',
      clip: 'M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 2h6v4H9z',
      users: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0z',
      image: 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM10 8.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zM21 15l-5-5L5 21',
      bulb: 'M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z',
      flag: 'M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7',
      join: 'M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M20 8v6M23 11h-6M12.5 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0z',
      brief: 'M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2zM16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16',
      mail: 'M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM22 6l-10 7L2 6',
      folder: 'M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z',
      sliders: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6',
      shield: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'
    };
    const raw = [
      { label: '', items: [['Dashboard', 'dash', '/admin'], ['Approvals', 'approve', '/admin/approvals', 19], ['Inbox', 'inbox', '/admin/inbox', 19]] },
      { label: 'Content', items: [['Events', 'cal', '/admin/events'], ['Applications', 'clip', '/admin/applications'], ['Members', 'users', '/admin/members'], ['Memories', 'image', '/admin/memories'], ['Ideas & Feedback', 'bulb', '/admin/ideas', 9]] },
      { label: 'Pages', items: [['Home page', 'home', '/admin/home'], ['Map / Committees', 'map', '/admin/committees'], ['EESTEC Journey', 'flag', '/admin/journey'], ['Join Us', 'join', '/admin/join'], ['Sponsors', 'brief', '/admin/sponsors'], ['Contact', 'mail', '/admin/contact']] },
      { label: 'System', items: [['Media library', 'folder', '/admin/media'], ['Settings', 'sliders', '/admin/settings'], ['Admin users', 'shield', '/admin/users']] }
    ];
    const groups = raw.map((g, gi) => ({
      label: g.label,
      showLabel: !!g.label && !rail,
      gap: gi === 0 ? '0' : (rail ? '10px' : '14px'),
      items: g.items.map(([t, ic, href, count]) => {
        const on = t === active;
        return {
          t, href, icon: I[ic], count: count || 0,
          current: on ? 'page' : 'false',
          bg: on ? '#fdf0f0' : 'transparent',
          fg: on ? '#b81f24' : '#3a3a3a',
          ic: on ? '#e52a30' : '#6b6b6b',
          weight: on ? 700 : 400,
          showText: !rail,
          hasCount: !!count && !rail,
          hasDot: !!count && rail,
          justify: rail ? 'center' : 'flex-start',
          padX: rail ? '0' : '12px'
        };
      })
    }));
    return {
      groups,
      wide: !rail,
      rail,
      minH: (this.props.minH ?? 900) + 'px',
      w: rail ? '72px' : '248px',
      pad: rail ? '0 12px 16px' : '0 12px 16px',
      logoPad: rail ? '0' : '4px',
      footJustify: rail ? 'center' : 'flex-start',
      footPad: rail ? '0' : '12px',
      collapseLabel: rail ? 'Expand menu' : 'Collapse menu',
      collapseIcon: rail ? 'M13 17l5-5-5-5M6 17l5-5-5-5' : 'M11 17l-5-5 5-5M18 17l-5-5 5-5'
    };
  }
}
</script>
</body>
</html>
