name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm i18n:check
      # The app must build with an empty environment (docs/ARCHITECTURE.md §6).
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # Builds again with the e2e flags (phase 2 + dev surfaces).
      - run: pnpm e2e
        env:
          FEATURE_FLAGS: phase2
          ENABLE_DEV_SURFACES: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
