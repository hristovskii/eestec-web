<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journey step</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<article class="j-card" style="width: 100%; padding: {{pad}}; border-radius: 16px; background: #ffffff; border: {{border}}; box-shadow: {{shadow}}; opacity: {{opacity}}; transform: {{transform}}; transition: box-shadow 0.2s, border-color 0.2s, transform 0.4s, opacity 0.4s; display: flex; flex-direction: column; gap: 14px; font-family: Roboto, 'Helvetica Neue', Arial, sans-serif; color: #1a1a1a; box-sizing: border-box">
  <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: #b81f24">STEP {{s.n}}</span>
  <h3 style="margin: 0; font-size: {{titleSize}}; line-height: 1.25; font-weight: 700">{{s.title}}</h3>
  <p style="margin: 0; font-size: {{textSize}}; line-height: 1.55; color: #6b6b6b">{{s.text}}</p>

  <sc-if value="{{isExpanded}}" hint-placeholder-val="{{ false }}">
    <div id="{{panelId}}" style="display: grid; grid-template-columns: {{cols}}; gap: 20px; align-items: start; padding-top: 6px; border-top: 1px solid #ececec; margin-top: 4px">
      <ul style="list-style: none; margin: 0; padding: 14px 0 0; display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{bullets}}" as="b" hint-placeholder-count="3">
          <li style="display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; font-size: 15px; line-height: 1.5"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e52a30" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span>{{b.t}}</span></li>
        </sc-for>
      </ul>
      <div style="margin-top: 14px; aspect-ratio: 4 / 3; border-radius: 12px; background: repeating-linear-gradient(135deg, #ececec 0 12px, #e5e5e5 12px 24px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 12px; text-align: center; color: #6b6b6b">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
        <span style="font-size: 12px; line-height: 1.4">Photo: {{s.photo}}</span>
      </div>
    </div>
    <figure style="margin: 4px 0 0; padding: 18px 20px; border-radius: 12px; background: #f5f5f5; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="#e52a30" aria-hidden="true"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1zM15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <blockquote style="margin: 0; font-size: 17px; line-height: 1.45; font-weight: 500">{{s.quote}}</blockquote>
        <figcaption style="font-size: 14px; color: #6b6b6b">{{s.author}}</figcaption>
      </div>
    </figure>
  </sc-if>

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 4px">
    <a href="{{s.href}}" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 8px; border: 2px solid #e52a30; background: {{ctaBg}}; color: {{ctaFg}}; font-size: 15px; font-weight: 500; text-decoration: none; box-sizing: border-box">{{s.cta}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg></a>
    <button type="button" aria-expanded="{{ariaExpanded}}" aria-controls="{{panelId}}" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 6px; border: 0; background: transparent; color: #1a1a1a; font-family: inherit; font-size: 15px; font-weight: 500; text-decoration: {{toggleUnderline}}; cursor: pointer">{{toggleLabel}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e52a30" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{chevron}}"></path></svg></button>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":null,"tsType":"{n: string, title: string, text: string, cta: string, href: string, bullets: string[], photo: string, quote: string, author: string}"},"expanded":{"editor":"boolean","default":false},"device":{"editor":"enum","options":["desktop","mobile"],"default":"desktop"},"state":{"editor":"enum","options":["default","hover","entering","hidden"],"default":"default"},"$preview":{"width":560,"height":221}}'>
class Component extends DCLogic {
  renderVals() {
    const s = Object.assign({
      n: '04', title: 'Go International', text: 'Apply for workshops and exchanges across Europe.', cta: 'See events abroad', href: '/upcoming',
      bullets: ['Workshops and exchanges in 20+ countries', 'Usually only a small participation fee', 'Friends in every corner of Europe'],
      photo: 'exchange group in front of TU Delft', quote: 'My first exchange changed everything.', author: 'Stefan Nikolovski · exchange in Delft, 2026'
    }, this.props.step || {});
    const expanded = !!this.props.expanded;
    const mobile = (this.props.device ?? 'desktop') === 'mobile';
    const state = this.props.state ?? 'default';
    const hot = state === 'hover' || expanded;
    return {
      s,
      bullets: (s.bullets || []).map((t) => ({ t })),
      isExpanded: expanded,
      panelId: 'step-' + s.n + '-more',
      ariaExpanded: expanded ? 'true' : 'false',
      toggleLabel: expanded ? 'Show less' : 'Show more',
      chevron: expanded ? 'M18 15l-6-6-6 6' : 'M6 9l6 6 6-6',
      toggleUnderline: state === 'hover' ? 'underline' : 'none',
      pad: mobile ? '20px' : '28px',
      cols: mobile ? 'minmax(0, 1fr)' : 'minmax(0, 1.2fr) minmax(0, 1fr)',
      titleSize: mobile ? '20px' : '24px',
      textSize: mobile ? '16px' : '17px',
      border: hot ? '2px solid #e52a30' : '1px solid #e3e3e3',
      shadow: hot ? '0 16px 40px rgba(0,0,0,0.12)' : '0 1px 2px rgba(0,0,0,0.05), 0 6px 20px rgba(0,0,0,0.06)',
      opacity: state === 'hidden' ? 0.15 : (state === 'entering' ? 0.6 : 1),
      transform: state === 'hidden' ? 'translateY(32px)' : (state === 'entering' ? 'translateY(14px)' : (state === 'hover' ? 'translateY(-4px)' : 'none')),
      ctaBg: hot ? '#e52a30' : '#ffffff',
      ctaFg: hot ? '#ffffff' : '#e52a30'
    };
  }
}
</script>
</body>
</html>
